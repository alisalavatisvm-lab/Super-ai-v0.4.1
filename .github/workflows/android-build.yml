name: Build SUPER AI Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project archive
        run: |
          unzip -q SUPER_AI_v0.4.1_local_first.zip -d extracted
          test -f extracted/super-ai-core/android/app/build.gradle.kts
          echo "Android project found."

      - name: Align Java and Kotlin JVM targets
        working-directory: extracted/super-ai-core/android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          # Configure both compilers explicitly, regardless of the project's
          # original defaults or whether compileOptions already existed.
          match = re.search(r'(?m)^(\\s*)android\\s*\\{', text)
          if not match:
              raise SystemExit("Could not locate the android { } block in app/build.gradle.kts")

          indent = match.group(1) + "    "
          config = (
              "\\n" + indent + "compileOptions {\\n"
              + indent + "    sourceCompatibility = JavaVersion.VERSION_17\\n"
              + indent + "    targetCompatibility = JavaVersion.VERSION_17\\n"
              + indent + "}\\n"
              + indent + "kotlinOptions {\\n"
              + indent + '    jvmTarget = "17"\\n'
              + indent + "}\\n"
          )
          insert_at = match.end()
          text = text[:insert_at] + config + text[insert_at:]
          path.write_text(text, encoding="utf-8")
          print("Explicit Java and Kotlin JVM targets set to 17.")
          PY

      - name: Build debug APK
        working-directory: extracted/super-ai-core/android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUPER-AI-v0.4.1-debug-apk
          path: extracted/super-ai-core/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
