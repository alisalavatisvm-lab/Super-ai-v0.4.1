name: Build SUPER AI Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project archive
        run: |
          unzip -q SUPER_AI_v0.4.1_local_first.zip -d extracted
          test -f extracted/super-ai-core/android/app/build.gradle.kts
          echo "Android project found."

      - name: Align Java and Kotlin JVM targets
        working-directory: extracted/super-ai-core/android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          original = text

          text = re.sub(r'(sourceCompatibility\s*=\s*JavaVersion\.)VERSION_1_8', r'\1VERSION_17', text)
          text = re.sub(r'(targetCompatibility\s*=\s*JavaVersion\.)VERSION_1_8', r'\1VERSION_17', text)
          text = re.sub(r'(sourceCompatibility\s*=\s*)"1\.8"', r'\1"17"', text)
          text = re.sub(r'(targetCompatibility\s*=\s*)"1\.8"', r'\1"17"', text)

          if text == original:
              print("No Java 8 declaration matched. Build file:")
              print(original)
              raise SystemExit("Expected Java 8 target was not found; refusing an unverified build.")
          path.write_text(text, encoding="utf-8")
          print("Java source/target compatibility aligned to 17.")
          PY

      - name: Build debug APK
        working-directory: extracted/super-ai-core/android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUPER-AI-v0.4.1-debug-apk
          path: extracted/super-ai-core/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
